schema_version: 1

context:
  name: lmdbm
  version: "0.0.6"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/lmdbm-${{ version }}.tar.gz
  sha256: 2c1d0dd995b074fe72154cc59c9221b348afccb237e2994aa0a463d6621a4db9

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - wheel
    - pip
    - flit-core
  run:
    - lmdb
    - typing-extensions >=4
    - python >=${{ python_min }}
    - python-lmdb

tests:
  - python:
      imports:
        - lmdbm
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: Python DBM style wrapper around LMDB (Lightning Memory-Mapped Database)
  license: ISC
  license_file: LICENSE
  homepage: https://github.com/Dobatymo/lmdb-python-dbm

extra:
  recipe-maintainers:
    - jan-janssen
